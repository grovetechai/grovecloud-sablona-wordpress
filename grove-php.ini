; Grove WordPress — PHP nastavení (25. 10. 2026)
expose_php = Off
allow_url_include = Off
display_errors = Off
log_errors = On
; PHP2Shell: samo o sobě nestačí (opravu dodává nová image), ale ubírá útočníkovi cestu.
session.upload_progress.enabled = 0
; Spouštění příkazů systému WordPress nepotřebuje; webshell po napadení pluginu ano.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 60
; Instalaci otevře jen vlastník (odkaz s klíčem z Grove Cloudu).
auto_prepend_file = /usr/local/lib/grove/grove-guard.php
